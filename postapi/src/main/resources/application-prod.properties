spring.mongodb.uri=${MONGODB_URI}
app.security.allowed-origins=${FRONTEND_ORIGINS}
app.security.dev-admin-bootstrap-enabled=false
app.auth.cookie-secure=true
app.auth.cookie-same-site=${AUTH_COOKIE_SAME_SITE:Strict}
