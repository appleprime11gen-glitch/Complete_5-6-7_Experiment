spring.data.mongodb.uri=mongodb://localhost:27017/postsdb
spring.data.mongodb.auto-index-creation=true
app.cache.enabled=${APP_CACHE_ENABLED:true}
app.jwt.secret-base64=${JWT_SECRET_BASE64:}
app.jwt.issuer=${JWT_ISSUER:postapi}
app.jwt.audience=${JWT_AUDIENCE:postapi-client}
app.jwt.access-minutes=${JWT_ACCESS_MINUTES:15}
app.auth.refresh-days=${REFRESH_TOKEN_DAYS:7}
app.auth.cookie-secure=${AUTH_COOKIE_SECURE:true}
app.auth.cookie-same-site=${AUTH_COOKIE_SAME_SITE:Strict}
app.security.allowed-origins=${FRONTEND_ORIGINS:http://localhost:8080}
app.crypto.key-base64=${APP_AES_KEY_BASE64:}
app.crypto.key-version=${APP_AES_KEY_VERSION:v1}
server.port=8080
logging.pattern.console=%d{HH:mm:ss} [%X{correlationId}] %-5level %logger{36} - %msg%n
